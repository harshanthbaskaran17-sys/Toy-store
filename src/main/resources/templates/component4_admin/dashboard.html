<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Admin Dashboard</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">Admin Dashboard</h2>
        
        <div class="row row-cols-1 row-cols-md-4 g-4 mb-5">
            <div class="col">
                <div class="card text-white bg-primary h-100">
                    <div class="card-body text-center">
                        <i class="fa-solid fa-users fs-1 mb-3"></i>
                        <h5 class="card-title">Total Users</h5>
                        <p class="display-4 fw-bold" th:text="${userCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card text-white bg-success h-100">
                    <div class="card-body text-center">
                        <i class="fa-solid fa-puzzle-piece fs-1 mb-3"></i>
                        <h5 class="card-title">Total Toys</h5>
                        <p class="display-4 fw-bold" th:text="${toyCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card text-white bg-info h-100">
                    <div class="card-body text-center">
                        <i class="fa-solid fa-box fs-1 mb-3"></i>
                        <h5 class="card-title">Total Orders</h5>
                        <p class="display-4 fw-bold" th:text="${orderCount}">0</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card text-white bg-warning h-100">
                    <div class="card-body text-center">
                        <i class="fa-solid fa-truck fs-1 mb-3"></i>
                        <h5 class="card-title">Manage Suppliers</h5>
                        <a th:href="@{/suppliers}" class="btn btn-light mt-3">View Suppliers</a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Manage Toys</h5>
                        <p class="card-text">Add new toys, update prices, or manage inventory.</p>
                        <a th:href="@{/toys}" class="btn btn-primary">Go to Toys</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Manage Users</h5>
                        <p class="card-text">View and manage customer accounts.</p>
                        <a th:href="@{/users}" class="btn btn-primary">Go to Users</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
