<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Checkout</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">Checkout</h2>
        <div class="row">
            <div class="col-md-8">
                <div class="card p-4 mb-4">
                    <h4 class="mb-3">Delivery Information</h4>
                    <form th:action="@{/orders/checkout}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Delivery Address</label>
                            <textarea class="form-control" name="deliveryAddress" rows="3" required placeholder="Street, City, Zip Code"></textarea>
                        </div>
                        <div class="alert alert-info">
                            <i class="fa-solid fa-info-circle me-2"></i> Payment will be collected on delivery (Cash on Delivery).
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">Confirm Order</button>
                    </form>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Final Review</h5>
                        <p class="text-muted small mb-3">
                            <span th:if="${session.userRole == 'PREMIUM'}"><i class="fa-solid fa-star text-warning"></i> Premium Member: 10% Discount applied!</span>
                            <span th:if="${session.userRole == 'REGULAR'}">Regular Member: Standard delivery rates apply.</span>
                        </p>
                        
                        <div class="d-flex justify-content-between fs-5 fw-bold text-success border-top pt-3">
                            <span>Total Amount</span>
                            <span th:text="${'Rs. ' + #numbers.formatDecimal(totalAmount, 1, 2)}">Total</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
