<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Edit Toy</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">
                    <h3 class="mb-4 text-primary"><i class="fa-solid fa-pen-to-square me-2"></i>Edit Toy</h3>
                    <form th:action="@{/toys/edit/{id}(id=${toy.id})}" method="post" enctype="multipart/form-data">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Toy Name</label>
                                <input type="text" class="form-control" th:value="${toy.name}" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Type</label>
                                <input type="text" class="form-control" th:value="${toy.category}" disabled>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Price (Rs.)</label>
                                <input type="number" step="0.01" min="0" class="form-control" name="price" th:value="${toy.price}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Stock Quantity</label>
                                <input type="number" min="0" class="form-control" name="stockQuantity" th:value="${toy.stockQuantity}" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Current Image</label>
                            <div class="mb-2">
                                <img th:src="${toy.getImageUrl()}" 
                                     alt="Current Image"
                                     class="rounded border shadow-sm"
                                     style="height: 120px; width: 160px; object-fit: cover;"
                                     onerror="this.src='/images/placeholder-toy.svg'">
                            </div>
                            <label class="form-label fw-bold">Replace Image <span class="text-muted fw-normal">(Optional &mdash; JPG, PNG, WEBP, max 5MB)</span></label>
                            <input type="file" class="form-control" name="image" accept=".jpg,.jpeg,.png,.webp">
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-2"></i>Update Toy</button>
                        <a th:href="@{/toys}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
