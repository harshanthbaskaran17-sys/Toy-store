<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Add Supplier</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 border-warning">
                    <h3 class="mb-4 text-warning"><i class="fa-solid fa-truck me-2"></i>Add New Supplier</h3>
                    <form th:action="@{/suppliers/register}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Supplier Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Contact Details</label>
                            <input type="text" class="form-control" name="contact" placeholder="Email or Phone" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Brands Supplied</label>
                            <input type="text" class="form-control" name="brands" placeholder="e.g. Lego, Mattel, Hasbro" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Supplier Type</label>
                            <select class="form-select" name="type">
                                <option value="LOCAL">Local Supplier</option>
                                <option value="INTERNATIONAL">International Supplier</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Supplier / Brand Logo <span class="text-muted fw-normal">(Optional &mdash; JPG, PNG, WEBP, max 5MB)</span></label>
                            <input type="file" class="form-control" name="image" accept=".jpg,.jpeg,.png,.webp">
                        </div>
                        <button type="submit" class="btn btn-primary">Add Supplier</button>
                        <a th:href="@{/suppliers}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
