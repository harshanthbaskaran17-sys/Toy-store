<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Add Toy</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">
                    <h3 class="mb-4 text-primary"><i class="fa-solid fa-plus-circle me-2"></i>Add New Toy</h3>
                    <form th:action="@{/toys/add}" method="post" enctype="multipart/form-data">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Toy Name</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Brand</label>
                                <input type="text" class="form-control" name="brand" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Type/Category</label>
                                <select class="form-select" name="type">
                                    <option value="EDUCATIONAL">Educational</option>
                                    <option value="ELECTRONIC">Electronic</option>
                                    <option value="NON_ELECTRONIC">Non-Electronic</option>
                                    <option value="PLUSH">Plush</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Age Group</label>
                                <select class="form-select" name="ageGroup">
                                    <option value="0-3">0-3 Years</option>
                                    <option value="3-5">3-5 Years</option>
                                    <option value="6-9">6-9 Years</option>
                                    <option value="10+">10+ Years</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Price (Rs.)</label>
                                <input type="number" step="0.01" min="0" class="form-control" name="price" placeholder="e.g. 4500" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Stock Quantity</label>
                                <input type="number" min="0" class="form-control" name="stockQuantity" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Toy Image <span class="text-muted fw-normal">(Optional &mdash; JPG, PNG, WEBP, max 5MB)</span></label>
                            <input type="file" class="form-control" name="image" accept=".jpg,.jpeg,.png,.webp">
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save me-2"></i>Save Toy</button>
                        <a th:href="@{/toys}" class="btn btn-outline-secondary ms-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
