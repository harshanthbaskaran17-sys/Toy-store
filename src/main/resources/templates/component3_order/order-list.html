<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Order History</title>
</head>
<body>
    <div layout:fragment="content">
        <h2 class="mb-4">My Orders</h2>
        
        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
            You haven't placed any orders yet. <a th:href="@{/toys}">Start shopping!</a>
        </div>

        <div class="row row-cols-1 g-4">
            <div class="col" th:each="order : ${orders}">
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Order #<span th:text="${order.id}"></span></span>
                        <span class="badge" 
                              th:classappend="${order.status == 'PENDING' ? 'bg-warning text-dark' : (order.status == 'DELIVERED' ? 'bg-success' : (order.status == 'CANCELLED' ? 'bg-danger' : 'bg-primary'))}"
                              th:text="${order.status}">Status</span>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-2">
                                <small class="text-muted d-block">Order Date</small>
                                <span th:text="${order.orderDate}">Date</span>
                            </div>
                            <div class="col-md-4 mb-2">
                                <small class="text-muted d-block">Total Amount</small>
                                <span class="fw-bold text-success" th:text="${'Rs. ' + #numbers.formatDecimal(order.totalAmount, 1, 2)}">Total</span>
                            </div>
                            <div class="col-md-4 mb-2">
                                <small class="text-muted d-block">Delivery Address</small>
                                <span th:text="${order.deliveryAddress}">Address</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white text-end" th:if="${order.status == 'PENDING'}">
                        <form th:action="@{/orders/cancel/{id}(id=${order.id})}" method="post" onsubmit="return confirm('Cancel this order?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Cancel Order</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
