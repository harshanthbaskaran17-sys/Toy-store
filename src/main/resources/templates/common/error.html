<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Error</title>
</head>
<body>
    <div layout:fragment="content" class="text-center py-5">
        <h1 class="display-1 text-danger"><i class="fa-solid fa-triangle-exclamation"></i></h1>
        <h2 class="mb-4">Oops! Something went wrong.</h2>
        <p class="lead text-muted mb-5" th:text="${errorMessage}">An unexpected error occurred.</p>
        <a th:href="@{/}" class="btn btn-primary btn-lg">Back to Home</a>
    </div>
</body>
</html>
