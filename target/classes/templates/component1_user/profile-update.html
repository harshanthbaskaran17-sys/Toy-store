<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>My Profile</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">
                    <h3 class="mb-4">Profile Details</h3>
                    <form th:action="@{/users/profile}" method="post" enctype="multipart/form-data">
                        <div class="d-flex align-items-center mb-4">
                            <img th:src="${user.getImageUrl()}" 
                                 alt="Profile Avatar"
                                 class="rounded-circle border shadow-sm me-3"
                                 style="width: 80px; height: 80px; object-fit: cover;"
                                 onerror="this.src='/images/placeholder-user.svg'">
                            <div>
                                <h5 class="mb-0" th:text="${user.username}">Username</h5>
                                <span class="badge bg-primary" th:text="${user.role}">ROLE</span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Profile Picture <span class="text-muted fw-normal">(Optional &mdash; JPG, PNG, WEBP, max 5MB)</span></label>
                            <input type="file" class="form-control" name="image" accept=".jpg,.jpeg,.png,.webp">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Username</label>
                            <input type="text" class="form-control" th:value="${user.username}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email address</label>
                            <input type="email" class="form-control" name="email" th:value="${user.email}" required>
                        </div>
                        <div class="mb-4" th:if="${user.role != 'ADMIN'}">
                            <label class="form-label fw-bold">Membership Type</label>
                            <select class="form-select" name="membershipType">
                                <option value="REGULAR" th:selected="${user.role == 'REGULAR'}">Regular Member</option>
                                <option value="PREMIUM" th:selected="${user.role == 'PREMIUM'}">Premium Member</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
