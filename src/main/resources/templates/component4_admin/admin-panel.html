<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">
<head>
    <title>Admin Management</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Admin Management Panel</h2>
            <a th:href="@{/admin/register}" class="btn btn-primary"><i class="fa-solid fa-user-plus"></i> Add Admin</a>
        </div>

        <div class="row">
            <div class="col-lg-7 mb-4">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Admin Accounts</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Permissions</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="admin : ${admins}">
                                    <td th:text="${admin.username}"></td>
                                    <td th:text="${admin.email}"></td>
                                    <td><span class="badge bg-secondary" th:text="${admin.permissions}"></span></td>
                                    <td>
                                        <form th:if="${session.loggedInUserId != admin.id}" th:action="@{/admin/delete/{id}(id=${admin.id})}" method="post" onsubmit="return confirm('Delete this admin?');">
                                            <button type="submit" class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button>
                                        </form>
                                        <span th:if="${session.loggedInUserId == admin.id}" class="badge bg-info text-dark">Current</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fa-solid fa-clipboard-list me-2"></i>Activity Log</h5>
                    </div>
                    <div class="card-body" style="max-height: 400px; overflow-y: auto;">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item px-0" th:each="log : ${logs}">
                                <div class="d-flex justify-content-between">
                                    <strong>Admin: <span th:text="${log.adminId}"></span></strong>
                                    <small class="text-muted" th:text="${log.timestamp}"></small>
                                </div>
                                <p class="mb-0 small" th:text="${log.action}"></p>
                            </li>
                        </ul>
                        <div th:if="${#lists.isEmpty(logs)}" class="text-center text-muted py-3">
                            No activity logs found.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
